<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">

        <header class="balance-section glass-card">
            <h2>TOTAL BALANCE</h2>
            <h1 id="total-balance">$0.00</h1>
        </header>

        <main class="content-grid">

            <section class="form-section glass-card">
                <h3>Add Transaction</h3>
                <form id="transaction-form">
                    <div class="input-group">
                        <label for="item-name">Item Name</label>
                        <input type="text" id="item-name" required>
                    </div>
                    <div class="input-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" step="0.01" required>
                    </div>
                    <div class="input-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Fun">Fun</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Add Transaction</button>
                </form>
            </section>

            <div class="data-display-section">

                <section class="transactions-section glass-card">
                    <h3>Transactions</h3>
                    <div class="scrollable-list">
                        <ul id="transaction-list"></ul>
                    </div>
                </section>

                <section class="chart-section glass-card">
                    <h3>Spending by Category</h3>
                    <canvas id="expense-chart"></canvas>
                </section>

            </div>
        </main>

    </div>
    <script src="js/script.js"></script>
</body>
</html>
